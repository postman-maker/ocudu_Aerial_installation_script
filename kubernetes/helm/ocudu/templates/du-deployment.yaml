apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocudu.duName" . }}
  labels: {{- include "ocudu.labels" . | nindent 4 }}
    app.kubernetes.io/component: du
spec:
  replicas: {{ .Values.du.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: du
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: du
      annotations:
        # Fronthaul (DPDK/vfio-pci) secondary interface from Multus/SR-IOV.
        k8s.v1.cni.cncf.io/networks: {{ .Values.networks.fhNad | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      runtimeClassName: nvidia            # GH200 GPU via NVIDIA container runtime
      initContainers:
        - name: render-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/render-config.sh", "/tmpl/du.yml.tmpl", "/etc/ocudu/du.yml"]
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: CU_F1_ADDR
              value: {{ include "ocudu.cuService" . | quote }}
            # FH_PCI is auto-detected from the SR-IOV device-plugin PCIDEVICE_* env.
          volumeMounts:
            - { name: tmpl, mountPath: /tmpl }
            - { name: rendered, mountPath: /etc/ocudu }
      containers:
        - name: odu
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["odu", "-c", "/etc/ocudu/du.yml"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              {{- toYaml .Values.du.resources.requests | nindent 14 }}
              {{- if .Values.du.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.du.gpu.count | quote }}
              {{- end }}
            limits:
              {{- toYaml .Values.du.resources.limits | nindent 14 }}
              {{- if .Values.du.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.du.gpu.count | quote }}
              {{- end }}
          volumeMounts:
            - { name: rendered, mountPath: /etc/ocudu }
            - { name: hugepage, mountPath: /hugepages }
            - { name: vfio, mountPath: /dev/vfio }
            - { name: modules, mountPath: /lib/modules, readOnly: true }
      volumes:
        - name: tmpl
          configMap: { name: {{ include "ocudu.duName" . }}-cfg }
        - name: rendered
          emptyDir: {}
        - name: hugepage
          emptyDir: { medium: HugePages }
        - name: vfio
          hostPath: { path: /dev/vfio }
        - name: modules
          hostPath: { path: /lib/modules }
