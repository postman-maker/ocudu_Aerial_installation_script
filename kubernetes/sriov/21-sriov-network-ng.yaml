# Multus NetworkAttachmentDefinition for NG (N2/N3). Static IPAM so the CU's
# N2/N3 bind address is deterministic and matches the 5G core routing.
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: ng-net
  namespace: sriov-network-operator
spec:
  resourceName: ng_netdev
  networkNamespace: ran
  spoofChk: "off"
  ipam: |
    {
      "type": "static",
      "addresses": [
        { "address": "10.60.0.10/24", "gateway": "10.60.0.1" }
      ]
    }
